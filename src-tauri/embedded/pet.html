<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;overflow:hidden;user-select:none}
#pet{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
img.sprite{image-rendering:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transition:opacity .25s}
#dog-run{width:112px}
#dog-sleep{width:106px}
.badge{position:absolute;top:-4px;right:-6px;background:#1c1c22;border:1px solid rgba(255,255,255,.2);border-radius:9px;font-size:10px;padding:1px 6px;color:#f97316;font-weight:700;font-family:monospace;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wrap{position:relative}
.hud{margin-top:2px;display:flex;gap:8px;font-size:10px;color:#e8e8e8;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.6);font-family:monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud b{color:#f97316}
.hud .sep{color:rgba(0,0,0,.35)}
body[data-state="run"] #dog-sleep{display:none}
body[data-state="sleep"] #dog-run{display:none}
body[data-state="run"] #dog-run{animation:bob .36s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#zzz{position:absolute;top:-4px;right:14px;font-family:monospace;color:#7fb8ff;font-size:12px;text-shadow:0 1px 3px #000;display:none;animation:floatz 2.2s ease-in-out infinite}
body[data-state="sleep"] #zzz{display:block}
@keyframes floatz{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(5px,-7px);opacity:1}}
</style></head>
<body><div id="pet" data-tauri-drag-region>
<div class="wrap" data-tauri-drag-region>
  <span id="zzz" data-tauri-drag-region>Z z z</span>
  <span class="badge" id="cost" data-tauri-drag-region>$0</span>
  <img id="dog-run" class="sprite" src="pet-run.png" data-tauri-drag-region alt="">
  <img id="dog-sleep" class="sprite" src="pet-sleep.png" data-tauri-drag-region alt="" style="display:none">
</div>
<div class="hud" data-tauri-drag-region><span id="rate">—</span><span class="sep">·</span><span id="ctx">CTX —</span></div>
</div>
<script>
function fT(n){if(n>=1e9)return(n/1e9).toFixed(1)+'G';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return String(Math.round(n))}
var cost=document.getElementById('cost'),rate=document.getElementById('rate'),ctx=document.getElementById('ctx'),zzz=document.getElementById('zzz');
function tick(){
  if(!window.__TAURI_INTERNALS__)return;
  var I=window.__TAURI_INTERNALS__.invoke;
  I('get_analytics',{range:'today',filters:null}).then(function(an){
    cost.textContent='$'+(an&&an.totals?(an.totals.cost>=100?an.totals.cost.toFixed(0):an.totals.cost.toFixed(2)):'0');
  }).catch(function(){});
  I('get_live_stats').then(function(rows){
    var a=rows.slice().sort(function(x,y){return y.tokens_per_min-x.tokens_per_min;})[0];
    var live=a&&a.tokens_per_min>0.05;
    document.body.dataset.state=live?'run':'sleep';
    rate.innerHTML=live?('▲ <b>'+Math.round(a.tokens_per_min/60)+'/s</b>'):'zzz…';
  }).catch(function(){});
  I('get_session_metrics',{source:'zcode',sessionId:null}).then(function(m){
    ctx.textContent='CTX '+(m?fT(m.last_context_tokens||0):'—');
  }).catch(function(){});
}
tick();
setInterval(tick,2000);
</script>
</body></html>

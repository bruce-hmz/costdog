<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;overflow:hidden;user-select:none}
/* 底部横条舞台：只有 220px 高，绝不全屏铺 absolute —— 全铺布局会触发
   透明窗合成死区（历史教训） */
#stage{position:fixed;left:0;right:0;bottom:0;height:220px}
.critter{position:absolute;bottom:110px;width:150px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:left 120ms linear;cursor:grab;touch-action:none}
/* 拖动中：去掉 left 的 1.2s 缓动（否则宠物追不上光标），并换成抓取光标 */
body.dragging .critter{transition:none;cursor:grabbing}
body.dragging .critter *{cursor:grabbing}
/* ── 三只宠物：每只一对元素（跑/睡）。可见性只由 data-pet × data-state 决定，
   全程不换 img.src（铁律 2：高频换 src 会重绘风暴挤出铭牌层）。
   狗有 8 帧走路雪碧图；猫/兔只有单帧跑图，靠步态弹跳 + 位移表现走动。 ── */
.crit-sleep{height:72px;width:auto;animation:sleepbreath 3.4s ease-in-out infinite}
@keyframes sleepbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* 雪碧图真值：8 帧 × 86.75px = 694×218，帧内容在纵向 0..71。元素只开 86px 视窗，
   steps(8) 总位移 694px ⇒ 每步 86.75px = 恰好一帧。此两处若写成 5552(=694×8)，
   素材会被横向拉伸 8 倍、纵向压扁 3 倍，狗变成一条涂抹（历史 bug）。 */
#dog-run.sheet{width:100px;height:72px;background-image:url("walk-sheet.png");background-size:824px 72px;background-repeat:no-repeat;animation:walkcycle .6s steps(8) infinite}
@keyframes walkcycle{from{background-position:0 0}to{background-position:-824px 0}}
body:not(.walking) #dog-run.sheet{animation:none;background-position:0 0}
#dog-run{transition:transform .3s}
body.walking #dog-run{animation:walkcycle .6s steps(8) infinite,stepbob .3s ease-in-out infinite}
/* 橘猫走路雪碧图：8 帧 × 107px = 856×72（生成图 2172×724 → 去白底 → 等分切帧 → 缩放到 72 高） */
#cat-run.sheet{width:93px;height:72px;background-image:url("cat-walk-sheet.png");background-size:768px 72px;background-repeat:no-repeat;animation:catwalk .6s steps(8) infinite}
@keyframes catwalk{from{background-position:0 0}to{background-position:-768px 0}}
body:not(.walking) #cat-run.sheet{animation:none;background-position:0 0}
body.walking #cat-run{animation:catwalk .6s steps(8) infinite,stepbob .3s ease-in-out infinite}
/* 灰兔走路雪碧图：8 帧 × 88px = 704×72 */
#rabbit-run.sheet{width:79px;height:72px;background-image:url("rabbit-walk-sheet.png");background-size:656px 72px;background-repeat:no-repeat;animation:rabbitwalk .6s steps(8) infinite}
@keyframes rabbitwalk{from{background-position:0 0}to{background-position:-656px 0}}
body:not(.walking) #rabbit-run.sheet{animation:none;background-position:0 0}
body.walking #rabbit-run{animation:rabbitwalk .6s steps(8) infinite,stepbob .3s ease-in-out infinite}
/* .crit-run 只是"当前跑图"的标记类（三个跑图元素都是雪碧图 div.sheet，尺寸与帧动画各自声明），
   setFace() 用它统一施加转向 scale */
.crit-run{height:72px}
body.walking .crit-run{animation:stepbob .3s ease-in-out infinite}
/* 白描边+投影让宠物在任何背景上都看得见。注意用 .sprite 而非 img.sprite——
   狗的跑图是 div（雪碧图），原选择器把它漏掉了，走路态因此没有描边。 */
.sprite{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 2px 3px rgba(255,255,255,.5)) drop-shadow(0 5px 12px rgba(0,0,0,.5));transform-origin:center;-webkit-user-drag:none;user-select:none}

@keyframes stepbob{0%,100%{transform:translateY(0)}25%{transform:translateY(-2.5px)}50%{transform:translateY(0)}75%{transform:translateY(-1.5px)}}
/* 铭牌贴住狗头顶：狗盒高 72px，bottom:80px ⇒ 与头顶留 8px（跑动 stepbob 抬 2.5px 仍有余量）。
   历史 bug：这里原用 top:-2px 钉在 170px 容器顶部，而狗被 flex-end 压在底部，中间空出 70px。 */
.plate{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(22,22,28,.92);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:2px 7px;color:#e8e8e8;font-family:monospace;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 3px 10px rgba(0,0,0,.45);text-align:center;line-height:1.25}
.plate .prow{white-space:nowrap}
.plate .pt{font-size:8px;color:#9aa0aa;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.plate .pb{font-size:11px}
.plate b{color:#f97316}
.plate .sep{color:rgba(255,255,255,.25);margin:0 2px}
/* 切换芯片与 Zzz 排在铭牌上方一行（bottom = 铭牌 80 + 铭牌高约 30 + 4px 间隙），
   不再压在铭牌上（原 top:16px 与铭牌重叠） */
#switcher{position:absolute;bottom:114px;left:6px;background:#1c1c22;border:1px solid rgba(255,255,255,.2);border-radius:9px;font-size:11px;line-height:1.2;padding:3px 9px;color:#7fb8ff;font-family:monospace;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#switcher:hover{color:#fff;border-color:#7fb8ff}
/* Zzz 与切换芯片同排（铭牌上方），随 floatz 上飘 */
#zzz{position:absolute;bottom:114px;right:6px;font-family:monospace;color:#7fb8ff;font-size:10px;text-shadow:0 1px 3px #000;display:none;animation:floatz 2.2s ease-in-out infinite}
body[data-state="sleep"] #zzz{display:block}
@keyframes floatz{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(5px,-7px);opacity:1}}
/* 可见性矩阵：默认全隐；选中的那只按状态显示跑图或睡图。
   不使用 hidden 属性（历史 bug：靠 hidden 隐藏睡姿精灵却没人移除它，
   静默 60s 后两个精灵都被隐藏 → 宠物彻底消失）。 */
#dog-run,#dog-sleep,#cat-run,#cat-sleep,#rabbit-run,#rabbit-sleep{display:none}
body[data-pet="dog"]:not([data-state="sleep"]) #dog-run,
body[data-pet="dog"][data-state="sleep"] #dog-sleep,
body[data-pet="cat"]:not([data-state="sleep"]) #cat-run,
body[data-pet="cat"][data-state="sleep"] #cat-sleep,
body[data-pet="rabbit"]:not([data-state="sleep"]) #rabbit-run,
body[data-pet="rabbit"][data-state="sleep"] #rabbit-sleep{display:block}
</style></head>
<body data-pet="dog" data-state="idle">
<div id="stage">
  <div class="critter" id="critter">
    <div class="plate" id="plate"><div class="prow pt"><span id="proj" style="color:#7fb8ff">—</span><span class="sep">·</span><span id="ctx">CTX —</span></div><div class="prow pb"><b id="rate">—</b><span class="sep">·</span><span id="cost">$0</span></div></div>
    <span id="zzz">Z z z</span>
    <span id="switcher" title="切换宠物">⇄</span>
    <div id="dog-run" class="sprite sheet crit-run"></div>
    <img id="dog-sleep" class="sprite crit-sleep" src="pet-sleep.png" alt="">
    <div id="cat-run" class="sprite sheet crit-run"></div>
    <img id="cat-sleep" class="sprite crit-sleep" src="pet-cat-sleep.png" alt="">
    <div id="rabbit-run" class="sprite sheet crit-run"></div>
    <img id="rabbit-sleep" class="sprite crit-sleep" src="pet-rabbit-sleep.png" alt="">
  </div>
</div>
<script>
function fT(n){if(n>=1e9)return(n/1e9).toFixed(1)+'G';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return String(Math.round(n))}
var proj=document.getElementById('proj'),rate=document.getElementById('rate'),cost=document.getElementById('cost'),ctx=document.getElementById('ctx'),plate=document.getElementById('plate');
var critter=document.getElementById('critter');
/* ── 宠物登记表 + 切换（⇄ 芯片循环 柴犬→橘猫→灰兔，选择持久化在 localStorage）──
   每只一对元素（跑/睡），切换只改 body[data-pet]，不换 img.src（铁律 2）。 */
var PETS=[
  {id:'dog',   name:'柴犬', run:'dog-run',    sleep:'dog-sleep'},
  {id:'cat',   name:'橘猫', run:'cat-run',    sleep:'cat-sleep'},
  {id:'rabbit',name:'灰兔', run:'rabbit-run', sleep:'rabbit-sleep'}
];
var petIdx=0, petFace=1;
try{
  var savedPet=localStorage.getItem('costdog.pet');
  if(savedPet){for(var pi=0;pi<PETS.length;pi++){if(PETS[pi].id===savedPet){petIdx=pi;}}}
}catch(e){}
function curPet(){return PETS[petIdx];}
/* 转向：用独立 scale 属性（不参与 transform 动画，所以不会被 stepbob 的
   transform 盖掉——旧代码用行内 scaleX(-1)，走动时被动画覆盖，宠物永远不回头）。
   对三个跑图元素一起设，谁被 CSS 显示出来谁就是对的，不与 petIdx 耦合。 */
function setFace(d){
  petFace=d;
  var s=(d>0?'1':'-1')+' 1';
  var els=document.querySelectorAll('.crit-run');
  for(var i=0;i<els.length;i++)els[i].style.scale=s;
}
function applyPet(){
  document.body.dataset.pet=curPet().id;
  var next=PETS[(petIdx+1)%PETS.length];
  document.getElementById('switcher').title='当前：'+curPet().name+'　点击换成'+next.name;
  setFace(petFace);
}
document.getElementById('switcher').addEventListener('click',function(e){
  e.stopPropagation();
  if(dragMoved)return;                     // 刚拖动过就别顺手切换
  petIdx=(petIdx+1)%PETS.length;
  try{localStorage.setItem('costdog.pet',curPet().id);}catch(err){}
  applyPet();
});
applyPet();
/* ── 窗内漫游状态机（窗口永不动）── */
var SW=window.innerWidth;
var dogX=SW*0.4, dir=1, walkTarget=null;
var state='pause', stateUntil=Date.now()+2000;
var lastLive=0, sleeping=false;
/* 宠物底边距窗口底部的距离（拖动可改，之后就在这个高度上散步） */
var roamBottom=110, PET_W=150, PET_H=170;
function clampX(x){return Math.max(10,Math.min(SW-160,x));}
function setDog(x){dogX=clampX(x);critter.style.left=dogX+'px';}
function clampBottom(b){return Math.max(6,Math.min(window.innerHeight-PET_H-30,b));}   // 顶部留 30px 避开菜单栏
function setPetBottom(b){roamBottom=clampBottom(b);critter.style.bottom=roamBottom+'px';}
/* 位置持久化：记住拖动后的 (left, bottom)，下次启动就从那儿开始
   （换分辨率/换屏后由 setDog/setPetBottom 夹取修正；拖动结束与召唤时写入） */
var POS_KEY='costdog.pos';
function savePos(){
  try{localStorage.setItem(POS_KEY,JSON.stringify({x:Math.round(dogX),b:Math.round(roamBottom)}));}catch(err){}
}
try{
  var savedPos=JSON.parse(localStorage.getItem(POS_KEY)||'null');
  if(savedPos&&typeof savedPos.x==='number')dogX=savedPos.x;
  if(savedPos&&typeof savedPos.b==='number')roamBottom=clampBottom(savedPos.b);
}catch(err){}
setDog(dogX);
setPetBottom(roamBottom);
/* ── 拖动 ──
   绝不移动窗口（铁律 1：程序化移窗会让非激活窗的移动帧不被合成 → 隐身），
   拖动只改宠物在窗内的 left/bottom；窗口是全屏的，所以视觉上等价于"拖着它在桌面上走"。
   与漫游的关系：拖动期间冻结状态机，松手后停 3s 再从新位置继续散步（手动位置优先）。 */
var dragging=false, dragMoved=false, grabDX=0, grabDY=0, dragX0=0, dragY0=0, dragLost=null;
function setDragMode(on){
  if(!window.__TAURI_INTERNALS__)return;
  window.__TAURI_INTERNALS__.invoke('set_pet_dragging',{dragging:on}).catch(function(){});
  clearTimeout(dragLost);
  if(on)dragLost=setTimeout(function(){ if(dragging)endDrag(); },15000);   // 兜底：pointerup 丢了也要收工
}
function onDragDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  dragging=true; dragMoved=false;
  grabDX=e.clientX-dogX;
  grabDY=e.clientY-(window.innerHeight-roamBottom-PET_H);   // 光标相对宠物框左上角
  dragX0=e.clientX; dragY0=e.clientY;
  try{critter.setPointerCapture(e.pointerId);}catch(err){}
  setDragMode(true);
}
function onDragMove(e){
  if(!dragging)return;
  if(!dragMoved){
    if(Math.abs(e.clientX-dragX0)<4&&Math.abs(e.clientY-dragY0)<4)return;   // 4px 阈值：之内算点击
    dragMoved=true;
    document.body.classList.add('dragging');
    state='pause'; stateUntil=Date.now()+1e9;    // 冻结漫游，别和手指抢位置
  }
  setDog(e.clientX-grabDX);
  setPetBottom(window.innerHeight-(e.clientY-grabDY)-PET_H);
}
function endDrag(){
  if(!dragging)return;
  dragging=false;
  document.body.classList.remove('dragging');
  try{critter.releasePointerCapture&&critter.releasePointerCapture(1);}catch(err){}
  setDragMode(false);
  if(dragMoved){ state='pause'; stateUntil=Date.now()+3000; walkTarget=null; setDog(dogX); savePos(); }
}
critter.addEventListener('pointerdown',onDragDown);
critter.addEventListener('pointermove',onDragMove);
critter.addEventListener('pointerup',endDrag);
critter.addEventListener('pointercancel',endDrag);
window.addEventListener('blur',endDrag);
// 步速必须与雪碧图的步幅自洽，否则就是"冰上滑"（用户反馈的"滑步"）。
// 实测「一个 8 帧循环里，脚（最低墨迹重心）相对身体前后移动多少像素」：
//   狗 19.5px（20%，换图前 8.6px）/ 猫 13.4px（14%，换图前 21.3px）/ 兔 23.1px（29%）
// 循环 0.6s 时，脚踩住地面的速度上限 = 步幅 ÷ 0.6s → 狗 32.5 / 猫 22.3 / 兔 38.4 px/s。
// 旧参数 SW*0.004（1920 屏 ≈70px/s）对狗曾经是上限的 4.9 倍 —— 整段路都在打滑。
// 所以按宠物分别取速度（换素材就改这张表；想跑更快只能重画步幅更大的雪碧图）；
// 另外用绝对像素而不是 SW 比例，否则 4K 屏上会自己加速到 140px/s。
var WALK_CYCLE_S=0.6;
// 三只于 2026-09-30 全部换过素材（旧图边缘锐度 54~62 = 像素风，且狗的步幅只有 8.6px
// → 必须慢跑到 14px/s 才不打滑）。新图边缘锐度 42~50（≈参考图缩到 72 高的基准
// 47~52，即平滑渲染），步幅也变大：狗 8.6→19.5、兔 21.7→23.1；猫 21.3→13.4
// （猫这张步幅小了些，速度表会跟着降到 22px/s，仍然不打滑）。
var PET_STRIDE={dog:19.5, cat:13.4, rabbit:23.1};
function walkPxPerTick(){
  var pet=PETS[petIdx];                       // PETS 在下方定义，运行时才求值
  var stride=PET_STRIDE[pet&&pet.id]||8.6;
  return stride/WALK_CYCLE_S*0.110;           // 每 110ms tick 的位移
}
function liveNow(){return Date.now()-lastLive<8000;}
setInterval(function(){
  SW=window.innerWidth;
  var now=Date.now();
  sleeping=!liveNow()&&now-lastLive>60000;
  if(!sleeping){
    if(now>stateUntil){
      if(state==='pause'||Math.random()<0.7){state='walk';walkTarget=clampX(20+Math.random()*(SW-200));dir=walkTarget>dogX?1:-1;stateUntil=now+9000;}
      else{state='pause';stateUntil=now+2000+Math.random()*3500;}
    }
    if(state==='walk'){
      if((dir>0&&dogX>=walkTarget-2)||(dir<0&&dogX<=walkTarget+2)){state='pause';stateUntil=now+2000+Math.random()*3000;}
      else setDog(dogX+dir*walkPxPerTick());
    }
    // 转向只翻转宠物跑图（铭牌文字永不镜像）
    if(dir!==petFace)setFace(dir);
  }
  var walking=state==='walk'&&!sleeping;
  document.body.dataset.state=sleeping?'sleep':(walking?'run':'idle');
  document.body.classList.toggle('walking',walking);
},110);
/* 8 帧走路循环：CSS steps 雪碧图动画（零重排），walking 挂 body */

/* 数据 */
var SESSIONS=[],lockedSession=null;
plate.addEventListener('click',function(e){
  e.stopPropagation();
  if(dragMoved)return;                     // 拖完松手不要顺带切换会话
  if(!SESSIONS.length)return;
  var ids=SESSIONS.map(function(x){return x.session_id;});
  var next;
  if(!lockedSession){next=ids[0];}
  else{var i=ids.indexOf(lockedSession);next=(i>=0&&i<ids.length-1)?ids[i+1]:null;}
  lockedSession=next;
  proj.style.color=next?'#f97316':'#7fb8ff';
  refreshSessions(true);           // 手选会话立刻生效，不等下一个慢 tick
});
// 慢数据（今日花费/会话名/CTX）分频拉取：它们本来每 2s 跟速率一起抢主线程，
// 而 3 个 IPC 里有 1 个是 945ms 的跨库全表查询（见 lib.rs 里 list_recent_sessions
// 的注释）——宠物因此"跑着跑着卡一下"。速率为王，其余降频。
var tickNo=0,lastSrc=null;
function refreshSessions(force){
  if(!window.__TAURI_INTERNALS__)return;
  var I=window.__TAURI_INTERNALS__.invoke;
  I('list_recent_sessions',{source:lastSrc||'zcode'}).then(function(list){
    if(force)SESSIONS=list||[];
    else if(list&&list.length)SESSIONS=list;
    var cur=lockedSession||(SESSIONS[0]&&SESSIONS[0].session_id);
    var hit=SESSIONS.find(function(x){return x.session_id===cur;});
    proj.textContent=hit?hit.project:'—';
    I('get_session_metrics',{source:lastSrc||'zcode',sessionId:cur}).then(function(m){
      ctx.textContent='CTX '+(m?fT(m.last_context_tokens||0):'—');
    }).catch(function(){});
  }).catch(function(){});
}
function tick(){
  if(!window.__TAURI_INTERNALS__)return;
  var I=window.__TAURI_INTERNALS__.invoke;
  tickNo++;
  if(tickNo===1||tickNo%8===0){                 // 今日花费：16s 一次（分钟级指标）
    I('get_analytics',{range:'today',filters:null}).then(function(an){
      cost.textContent='$'+(an&&an.totals?(an.totals.cost>=100?an.totals.cost.toFixed(0):an.totals.cost.toFixed(2)):'0');
    }).catch(function(){});
  }
  I('get_live_stats').then(function(rows){
    var a=rows.slice().sort(function(x,y){return y.tokens_per_min-x.tokens_per_min;})[0];
    var live=a&&a.tokens_per_min>0.05;
    if(live)lastLive=Date.now();
    rate.innerHTML=live?('▲ '+Math.round(a.tokens_per_min/60)+'/s'):'<span style="color:#7fb8ff">zzz</span>';
    var src=a?a.source:'zcode';
    // 会话名/CTX 变化慢：10s 一次；活跃源换了立刻刷（否则铭牌会挂着别的项目名）
    if(src!==lastSrc){lastSrc=src;refreshSessions(true);}
    else if(tickNo%5===0)refreshSessions(false);
  }).catch(function(){});
}
tick();
setInterval(tick,2000);
// 自主验收通道：狗矩形上报 + 召唤检测（托盘"召唤小狗"→回中央+强制重绘）
// 召唤计数走 IPC：本页受 app CSP 约束（connect-src 'self' ipc: http://ipc.localhost），
// 直接 fetch http://127.0.0.1:9401/pet.json 会被 CSP 拒掉（历史 bug：自救开关因此失效）。
var lastSummon=-1;
setInterval(function(){
  var r=critter.getBoundingClientRect();
  if(!window.__TAURI_INTERNALS__)return;
  var I=window.__TAURI_INTERNALS__.invoke;
  I('set_pet_rect',{x:r.left,y:r.top,w:r.width,h:r.height}).catch(function(){});
  I('get_summon_count').then(function(n){
    if(lastSummon<0||typeof n!=='number'){lastSummon=n;return;}
    if(n>lastSummon){
      lastSummon=n;
      // 召唤：移到屏幕中央 + 触发重绘（对冲任何合成异常）
      setDog(window.innerWidth/2-75);
      critter.style.transition='none';critter.style.left=(window.innerWidth/2-75)+'px';
      requestAnimationFrame(function(){critter.style.transition='';});
      document.body.style.opacity='0.99';
      setTimeout(function(){document.body.style.opacity='1';},60);
      savePos();
    }
  }).catch(function(){});
},500);
// 坐标报告：写入窗口标题供外部 AX 读取（PET:x,y 屏幕 CSS 坐标）
